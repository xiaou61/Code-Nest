name: External Uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: code-nest-external-uptime
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  probe:
    name: Probe Public Endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe user and admin frontends
        id: probe
        continue-on-error: true
        env:
          CODE_NEST_UPTIME_ENDPOINTS: >-
            http://36.140.150.167:81/
            http://36.140.150.167:82/
          CODE_NEST_UPTIME_ATTEMPTS: "3"
          CODE_NEST_UPTIME_RETRY_DELAY_SECONDS: "10"
        run: bash scripts/external-uptime-check.sh

      - name: Update uptime incident issue
        uses: actions/github-script@v7
        env:
          PROBE_OVERALL: ${{ steps.probe.outputs.overall }}
          PROBE_DETAILS: ${{ steps.probe.outputs.details }}
          PROBE_CHECKED_AT: ${{ steps.probe.outputs.checked_at }}
        with:
          script: |
            const marker = '<!-- code-nest-external-uptime -->';
            const title = '[uptime] Code Nest public endpoints unavailable';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const incident = issues.find((issue) =>
              !issue.pull_request && issue.body && issue.body.includes(marker));
            const overall = process.env.PROBE_OVERALL || 'down';
            const checkedAt = process.env.PROBE_CHECKED_AT || new Date().toISOString();
            const details = process.env.PROBE_DETAILS || 'Probe did not return details.';

            if (overall === 'down') {
              const body = [
                marker,
                'The external GitHub-hosted probe cannot obtain HTTP 200 from every public endpoint.',
                '',
                '```text',
                details,
                '```',
                '',
                `Last checked: ${checkedAt}`,
                `Workflow run: ${runUrl}`,
                '',
                'This issue is maintained automatically and will be closed after recovery.',
              ].join('\n');
              if (incident) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: incident.number,
                  title,
                  body,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                });
              }
            } else if (incident) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: incident.number,
                body: `Recovered at ${checkedAt}. All configured endpoints returned HTTP 200.\n\nWorkflow run: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: incident.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }

      - name: Fail unhealthy probe
        if: steps.probe.outputs.overall != 'up'
        run: |
          echo 'One or more public endpoints failed the external uptime probe.' >&2
          exit 1
