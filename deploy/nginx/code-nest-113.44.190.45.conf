map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream code_nest_backend {
    server 127.0.0.1:9999;
    keepalive 64;
}

server {
    listen 80;
    server_name 113.44.190.45;

    root /var/www/code-nest-user;
    index index.html;

    client_max_body_size 100m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Actuator 指标仅允许监控网络直连后端获取，不能通过公网 Nginx 访问。
    location ^~ /api/actuator/ {
        return 404;
    }

    # Alertmanager webhook 只允许监控网络直连后端，不能经过公网 Nginx。
    location ^~ /api/internal/sre/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://code_nest_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /files/ {
        alias /opt/code-nest/uploads/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public";
    }
}

server {
    listen 81;
    server_name 113.44.190.45;

    root /var/www/code-nest-admin;
    index index.html;

    client_max_body_size 100m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 管理端同样不代理 Actuator，避免管理员登录入口成为指标泄露面。
    location ^~ /api/actuator/ {
        return 404;
    }

    # 管理端同样不代理内部 SRE webhook，避免机器凭据入口暴露到公网。
    location ^~ /api/internal/sre/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://code_nest_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
