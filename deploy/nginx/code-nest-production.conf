map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream code_nest_backend_upstream {
    server 127.0.0.1:9999;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    listen 81;
    server_name 36.140.150.167;

    root /var/www/code-nest-user;
    index index.html;
    client_max_body_size 100m;

    location = /api/actuator {
        return 404;
    }

    location ^~ /api/actuator/ {
        return 404;
    }

    location = /api/internal/sre {
        return 404;
    }

    location ^~ /api/internal/sre/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://code_nest_backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /admin/ {
        return 302 http://36.140.150.167:82/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 82;
    server_name 36.140.150.167;

    root /var/www/code-nest-admin;
    index index.html;
    client_max_body_size 100m;

    location = /api/actuator {
        return 404;
    }

    location ^~ /api/actuator/ {
        return 404;
    }

    location = /api/internal/sre {
        return 404;
    }

    location ^~ /api/internal/sre/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://code_nest_backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
